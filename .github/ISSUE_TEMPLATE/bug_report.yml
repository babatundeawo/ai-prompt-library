name: Bug report
description: Something on the site is broken or looks wrong.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page or prompt
      placeholder: "library.html, or the prompt's title"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: "Safari on iPhone, Chrome on Windows, ..."
